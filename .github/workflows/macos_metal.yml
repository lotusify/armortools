name: macOS (Metal)

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: macOS-latest

    steps:
    - uses: actions/checkout@v3
    - name: Compile
      run: |
        cd paint
        ../base/make --compile
    - name: Upload artifact (all)
      uses: actions/upload-artifact@v4
      with:
        name: ArmorPaint-macos
        path: paint/build/Release/
        if-no-files-found: error
    - name: Upload artifact (app bundle only)
      uses: actions/upload-artifact@v4
      with:
        name: ArmorPaint-macos-app
        path: paint/build/Release/ArmorPaint.app
        if-no-files-found: error
